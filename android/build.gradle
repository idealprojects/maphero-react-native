apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

buildscript {
    ext {
        buildToolsVersion = "33.0.0"
        minSdkVersion = 16
        compileSdkVersion = 34
        targetSdkVersion = 33
        supportLibVersion = "28.0.0"
    }

    repositories {
        google()
        mavenCentral()
    }
}

android {
    compileSdkVersion safeExtGet("compileSdkVersion", 33)
    buildToolsVersion safeExtGet("buildToolsVersion", '33.0.1')

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 16)
        targetSdkVersion safeExtGet('targetSdkVersion', 26)
        versionCode 1
        versionName "1.0"
        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString())
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // MapHero SDK. Sends the API key as X-API-Key from 1.3.0. Upstream MapLibre's SDK is no longer
    // pulled in beside it: the plugins that needed it are vendored against MapHero (see
    // src/main/java/org/maplibre/android/plugins/README.md).
    implementation "io.maphero:android-sdk:1.3.0"
    implementation "org.maplibre.gl:android-sdk-turf:6.0.1"
    implementation "com.jakewharton.timber:timber:5.0.1" // used by the vendored localization plugin

    // Dependencies
    implementation "androidx.vectordrawable:vectordrawable:1.1.0"
    implementation "androidx.annotation:annotation:1.7.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.squareup.okhttp3:okhttp:${safeExtGet('okhttpVersion', '4.9.0')}"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:${safeExtGet('okhttpVersion', '4.9.0')}"

}
